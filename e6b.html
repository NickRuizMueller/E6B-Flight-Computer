<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Vollständiger E6B Flight Computer mit Gyroskop-Funktionalität</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1, h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        h1 {
            text-align: center;
        }
        .computer-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }
        .side {
            flex: 1;
            min-width: 300px;
            max-width: 600px;
        }
        .calculator-side, .wind-side {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #2980b9;
        }
        .result {
            background: #e3f2fd;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            min-height: 30px;
        }
        .wind-disc {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 500px;
            margin: 0 auto;
        }
        #wind-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #f9f9f9;
            border: 2px solid #333;
            position: absolute;
            top: 0;
            left: 0;
            overflow: visible;
            touch-action: none;
        }
        #inner-disc {
            position: absolute;
            width: 70%;
            height: 70%;
            border-radius: 50%;
            background: #e6e6e6;
            border: 2px solid #555;
            top: 15%;
            left: 15%;
            transform-origin: center;
            cursor: grab;
            touch-action: none;
        }
        #true-north {
            position: absolute;
            width: 2px;
            height: 50%;
            background: red;
            top: 0;
            left: 50%;
            transform-origin: bottom center;
        }
        #grid-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        #wind-vector {
            position: absolute;
            width: 2px;
            height: 30%;
            background: cyan;
            top: 20%;
            left: 50%;
            transform-origin: bottom center;
            display: none;
        }
        #aircraft {
            position: absolute;
            width: 40px;
            height: 40px;
            top: calc(50% - 20px);
            left: calc(50% - 20px);
            z-index: 10;
        }
        .aircraft-icon {
            width: 100%;
            height: 100%;
            transform-origin: center;
        }
        .degrees {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        .degree-mark {
            position: absolute;
            width: 1px;
            height: 10px;
            background: #333;
            top: 0;
            left: 50%;
            transform-origin: bottom center;
        }
        .degree-text {
            position: absolute;
            transform-origin: center;
            font-size: 12px;
            color: #333;
        }
        .wind-controls {
            margin-top: 20px;
            padding: 15px;
            background: #f0f4f8;
            border-radius: 8px;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background: #e0e0e0;
            border: 1px solid #ccc;
        }
        .tab.active {
            background: #3498db;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        /* Gyroscope-spezifische Styles */
        .gyro-container {
            position: relative;
            perspective: 1000px;
            width: 300px;
            height: 300px;
            margin: 30px auto;
        }
        .gyro {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
        }
        .gyro-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #777;
            box-sizing: border-box;
        }
        .gyro-ring-x {
            transform: rotateY(90deg);
        }
        .gyro-ring-y {
            transform: rotateX(90deg);
        }
        .gyro-disc {
            position: absolute;
            width: 80%;
            height: 80%;
            left: 10%;
            top: 10%;
            border-radius: 50%;
            background: radial-gradient(#4a90e2, #2c3e50);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .gyro-values {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .gyro-value {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            flex: 1;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kompletter E6B Flight Computer mit Gyroskop</h1>

        <div class="computer-container">
            <!-- Linke Seite: Rechenschieber -->
            <div class="side">
                <h2>Rechenschieber (Vorderseite)</h2>

                <div class="calculator-side">
                    <h3>Zeit, Strecke und Geschwindigkeit</h3>
                    <div class="input-group">
                        <label for="speed">Geschwindigkeit (kt)</label>
                        <input type="number" id="speed" placeholder="z.B. 120">
                    </div>
                    <div class="input-group">
                        <label for="distance">Strecke (NM)</label>
                        <input type="number" id="distance" placeholder="z.B. 60">
                    </div>
                    <div class="input-group">
                        <label for="time">Zeit (min)</label>
                        <input type="number" id="time" placeholder="z.B. 30">
                    </div>
                    <button onclick="calculateTimeDistanceSpeed()">Berechnen</button>
                    <div id="tsd-result" class="result"></div>
                </div>

                <div class="calculator-side">
                    <h3>Kraftstoffberechnung</h3>
                    <div class="input-group">
                        <label for="fuel-rate">Verbrauch (l/h)</label>
                        <input type="number" id="fuel-rate" placeholder="z.B. 28">
                    </div>
                    <div class="input-group">
                        <label for="flight-time">Flugzeit (h)</label>
                        <input type="number" id="flight-time" placeholder="z.B. 1.5">
                    </div>
                    <button onclick="calculateFuel()">Berechnen</button>
                    <div id="fuel-result" class="result"></div>
                </div>

                <div class="calculator-side">
                    <h3>Einheitenumrechner</h3>
                    <div class="input-group">
                        <label for="convert-value">Wert</label>
                        <input type="number" id="convert-value" placeholder="Wert eingeben">
                    </div>
                    <div class="input-group">
                        <label for="from-unit">Von</label>
                        <select id="from-unit">
                            <option value="nm">Seemeilen (NM)</option>
                            <option value="sm">Statute Miles (SM)</option>
                            <option value="km">Kilometer (km)</option>
                            <option value="ft">Fuß (ft)</option>
                            <option value="m">Meter (m)</option>
                            <option value="gal">Gallonen (US)</option>
                            <option value="l">Liter (l)</option>
                            <option value="lbs">Pfund (lbs)</option>
                            <option value="kg">Kilogramm (kg)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="to-unit">Nach</label>
                        <select id="to-unit">
                            <option value="sm">Statute Miles (SM)</option>
                            <option value="nm">Seemeilen (NM)</option>
                            <option value="km">Kilometer (km)</option>
                            <option value="m">Meter (m)</option>
                            <option value="ft">Fuß (ft)</option>
                            <option value="l">Liter (l)</option>
                            <option value="gal">Gallonen (US)</option>
                            <option value="kg">Kilogramm (kg)</option>
                            <option value="lbs">Pfund (lbs)</option>
                        </select>
                    </div>
                    <button onclick="convertUnits()">Umrechnen</button>
                    <div id="convert-result" class="result"></div>
                </div>
            </div>

            <!-- Rechte Seite: Winddreieck und Gyroskop -->
            <div class="side">
                <h2>Windseite und Gyroskop</h2>

                <div class="tabs">
                    <div class="tab active" onclick="showTab('wind-tab')">Winddreieck</div>
                    <div class="tab" onclick="showTab('gyro-tab')">Gyroskop</div>
                </div>

                <!-- Winddreieck-Tab -->
                <div id="wind-tab" class="tab-content active">
                    <div class="wind-side">
                        <div class="wind-controls">
                            <div class="input-group">
                                <label for="true-course">True Course (°)</label>
                                <input type="number" id="true-course" min="0" max="360" placeholder="z.B. 090">
                            </div>
                            <div class="input-group">
                                <label for="true-airspeed">True Airspeed (kt)</label>
                                <input type="number" id="true-airspeed" min="0" placeholder="z.B. 120">
                            </div>
                            <div class="input-group">
                                <label for="wind-direction">Windrichtung (°)</label>
                                <input type="number" id="wind-direction" min="0" max="360" placeholder="z.B. 180">
                            </div>
                            <div class="input-group">
                                <label for="wind-speed">Windgeschwindigkeit (kt)</label>
                                <input type="number" id="wind-speed" min="0" placeholder="z.B. 15">
                            </div>
                            <button onclick="calculateWindTriangle()">Winddreieck berechnen</button>
                            <div id="wind-result" class="result"></div>
                        </div>

                        <div class="wind-disc">
                            <svg id="wind-circle" viewBox="0 0 500 500">
                                <!-- Äußerer Kreis mit Gradzahlen -->
                                <circle cx="250" cy="250" r="240" fill="#f9f9f9" stroke="#333" stroke-width="2"/>

                                <!-- Gradmarkierungen -->
                                <g id="degree-marks"></g>

                                <!-- Innerer drehbarer Kreis -->
                                <g id="inner-disc" transform="rotate(0, 250, 250)">
                                    <circle cx="250" cy="250" r="180" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
                                    <!-- Gitterlinien -->
                                    <g id="grid-lines">
                                        <line x1="70" y1="250" x2="430" y2="250" stroke="#aaa" stroke-width="1"/>
                                        <line x1="250" y1="70" x2="250" y2="430" stroke="#aaa" stroke-width="1"/>
                                    </g>
                                    <!-- Flugzeug-Symbol in der Mitte -->
                                    <g id="aircraft" transform="translate(250, 250)">
                                        <path d="M0,-15 L10,0 L5,15 L-5,15 L-10,0 Z" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
                                    </g>
                                </g>

                                <!-- Wind-Vektor -->
                                <line id="wind-vector" x1="250" y1="250" x2="250" y2="100" stroke="cyan" stroke-width="3" marker-end="url(#arrowhead)"/>

                                <!-- Kurs-Vektor -->
                                <line id="course-vector" x1="250" y1="250" x2="450" y2="250" stroke="green" stroke-width="3" marker-end="url(#arrowhead)"/>

                                <!-- Heading-Vektor -->
                                <line id="heading-vector" x1="250" y1="250" x2="430" y2="230" stroke="red" stroke-width="3" marker-end="url(#arrowhead)"/>

                                <!-- Pfeilspitzen-Definitionen -->
                                <defs>
                                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                                        <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
                                    </marker>
                                </defs>

                                <!-- True North Marker -->
                                <line id="true-north" x1="250" y1="10" x2="250" y2="250" stroke="red" stroke-width="2"/>
                                <text x="260" y="30" fill="red">N</text>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Gyroskop-Tab -->
                <div id="gyro-tab" class="tab-content">
                    <div class="wind-side">
                        <h3>Gyroskop (Künstlicher Horizont)</h3>

                        <div class="gyro-container">
                            <div class="gyro" id="gyroscope">
                                <div class="gyro-ring gyro-ring-x"></div>
                                <div class="gyro-ring gyro-ring-y"></div>
                                <div class="gyro-ring"></div>
                                <div class="gyro-disc">GYRO</div>
                            </div>
                        </div>

                        <div class="gyro-values">
                            <div class="gyro-value">
                                <div>Pitch</div>
                                <div id="pitch-value">0°</div>
                            </div>
                            <div class="gyro-value">
                                <div>Roll</div>
                                <div id="roll-value">0°</div>
                            </div>
                            <div class="gyro-value">
                                <div>Heading</div>
                                <div id="heading-value">0°</div>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="gyro-mode">Gyroskop-Modus</label>
                            <select id="gyro-mode" onchange="changeGyroMode()">
                                <option value="manual">Manuell</option>
                                <option value="device">Gerätesensoren (wenn verfügbar)</option>
                            </select>
                        </div>

                        <div id="manual-controls">
                            <div class="input-group">
                                <label for="manual-pitch">Pitch (Nicken) -90° bis 90°</label>
                                <input type="range" id="manual-pitch" min="-90" max="90" value="0" oninput="updateGyroManual()">
                            </div>
                            <div class="input-group">
                                <label for="manual-roll">Roll (Rollen) -180° bis 180°</label>
                                <input type="range" id="manual-roll" min="-180" max="180" value="0" oninput="updateGyroManual()">
                            </div>
                            <div class="input-group">
                                <label for="manual-heading">Heading (Gieren) 0° bis 359°</label>
                                <input type="range" id="manual-heading" min="0" max="359" value="0" oninput="updateGyroManual()">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
// ===== Allgemeine Funktionen =====
function showTab(tabId) {
    const tabs = document.querySelectorAll('.tab');
    const tabContents = document.querySelectorAll('.tab-content');

    tabs.forEach(tab => tab.classList.remove('active'));
    tabContents.forEach(content => content.classList.remove('active'));

    document.querySelector(`.tab[onclick="showTab('${tabId}')"]`).classList.add('active');
    document.getElementById(tabId).classList.add('active');
}

// ===== Rechenschieber-Funktionen =====
function calculateTimeDistanceSpeed() {
    const speed = parseFloat(document.getElementById('speed').value);
    const distance = parseFloat(document.getElementById('distance').value);
    const time = parseFloat(document.getElementById('time').value);

    let result = '';

    if (!isNaN(speed) && !isNaN(distance) && isNaN(time)) {
        // Berechne Zeit
        const calculatedTime = (distance / speed) * 60; // in Minuten
        const hours = Math.floor(calculatedTime / 60);
        const minutes = Math.round(calculatedTime % 60);
        result = `Zeit: <b>${hours}h ${minutes}min</b>`;
    } else if (!isNaN(speed) && !isNaN(time) && isNaN(distance)) {
        // Berechne Strecke
        const calculatedDistance = (speed * time) / 60; // in NM
        result = `Strecke: <b>${calculatedDistance.toFixed(1)} NM</b>`;
    } else if (!isNaN(distance) && !isNaN(time) && isNaN(speed)) {
        // Berechne Geschwindigkeit
        const calculatedSpeed = (distance / time) * 60; // in Knoten
        result = `Geschwindigkeit: <b>${calculatedSpeed.toFixed(1)} kt</b>`;
    } else {
        result = 'Bitte geben Sie genau zwei der drei Werte ein.';
    }

    document.getElementById('tsd-result').innerHTML = result;
}

function calculateFuel() {
    const fuelRate = parseFloat(document.getElementById('fuel-rate').value);
    const flightTime = parseFloat(document.getElementById('flight-time').value);

    if (isNaN(fuelRate) || isNaN(flightTime)) {
        document.getElementById('fuel-result').innerHTML = 'Bitte geben Sie alle Werte ein.';
        return;
    }

    const fuelRequired = fuelRate * flightTime;
    const fuelWithReserve = fuelRequired * 1.3; // 30% Reserve

    document.getElementById('fuel-result').innerHTML =
        `Benötigter Treibstoff: <b>${fuelRequired.toFixed(1)} Liter</b><br>` +
        `Mit 30% Reserve: <b>${fuelWithReserve.toFixed(1)} Liter</b>`;
}

const conversionFactors = {
    'nm-sm': 1.15078,
    'nm-km': 1.852,
    'nm-m': 1852,
    'nm-ft': 6076.12,
    'sm-nm': 0.868976,
    'sm-km': 1.60934,
    'sm-m': 1609.34,
    'sm-ft': 5280,
    'km-nm': 0.539957,
    'km-sm': 0.621371,
    'km-m': 1000,
    'km-ft': 3280.84,
    'ft-nm': 0.000164579,
    'ft-sm': 0.000189394,
    'ft-km': 0.0003048,
    'ft-m': 0.3048,
    'm-nm': 0.000539957,
    'm-sm': 0.000621371,
    'm-km': 0.001,
    'm-ft': 3.28084,
    'gal-l': 3.78541,
    'l-gal': 0.264172,
    'lbs-kg': 0.453592,
    'kg-lbs': 2.20462
};

function convertUnits() {
    const value = parseFloat(document.getElementById('convert-value').value);
    const fromUnit = document.getElementById('from-unit').value;
    const toUnit = document.getElementById('to-unit').value;

    if (isNaN(value)) {
        document.getElementById('convert-result').innerHTML = 'Bitte geben Sie einen gültigen Wert ein.';
        return;
    }

    const conversionKey = `${fromUnit}-${toUnit}`;

    if (conversionFactors[conversionKey]) {
        const result = value * conversionFactors[conversionKey];
        document.getElementById('convert-result').innerHTML =
            `${value} ${getUnitFullName(fromUnit)} = <b>${result.toFixed(2)} ${getUnitFullName(toUnit)}</b>`;
    } else {
        document.getElementById('convert-result').innerHTML = 'Umrechnung nicht verfügbar.';
    }
}

function getUnitFullName(unit) {
    const units = {
        'nm': 'Seemeilen (NM)',
        'sm': 'Statute Miles (SM)',
        'km': 'Kilometer (km)',
        'm': 'Meter (m)',
        'ft': 'Fuß (ft)',
        'gal': 'Gallonen (US)',
        'l': 'Liter (l)',
        'lbs': 'Pfund (lbs)',
        'kg': 'Kilogramm (kg)'
    };
    return units[unit] || unit;
}

// ===== Winddreieck-Funktionen =====
function initDegreeMarks() {
    const degreesGroup = document.getElementById('degree-marks');

    for (let i = 0; i < 360; i += 10) {
        // Markierung
        const mark = document.createElementNS("http://www.w3.org/2000/svg", "line");
        const angle = i * Math.PI / 180;
        const x1 = 250 + Math.sin(angle) * 240;
        const y1 = 250 - Math.cos(angle) * 240;
        const x2 = 250 + Math.sin(angle) * 220;
        const y2 = 250 - Math.cos(angle) * 220;

        mark.setAttribute("x1", x1);
        mark.setAttribute("y1", y1);
        mark.setAttribute("x2", x2);
        mark.setAttribute("y2", y2);
        mark.setAttribute("stroke", "#333");
        mark.setAttribute("stroke-width", i % 30 === 0 ? "2" : "1");
        degreesGroup.appendChild(mark);

        // Text
        if (i % 30 === 0) {
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            const textX = 250 + Math.sin(angle) * 200;
            const textY = 250 - Math.cos(angle) * 200;

            text.setAttribute("x", textX);
            text.setAttribute("y", textY);
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("alignment-baseline", "middle");
            text.setAttribute("font-size", "12");
            text.setAttribute("fill", "#333");
            text.textContent = i;
            degreesGroup.appendChild(text);
        }
    }
}

// Initialisierung des drehbaren Kreises
function initRotatableDisc() {
    const innerDisc = document.getElementById('inner-disc');
    let isDragging = false;
    let previousAngle = 0;
    let currentRotation = 0;

    function getAngle(cx, cy, px, py) {
        return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
    }

    // Maus-Events
    innerDisc.addEventListener('mousedown', startDrag);
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', endDrag);

    // Touch-Events
    innerDisc.addEventListener('touchstart', startDrag);
    document.addEventListener('touchmove', drag);
    document.addEventListener('touchend', endDrag);

    function startDrag(e) {
        e.preventDefault();
        isDragging = true;

        const svgRect = document.getElementById('wind-circle').getBoundingClientRect();
        const centerX = svgRect.left + svgRect.width / 2;
        const centerY = svgRect.top + svgRect.height / 2;

        const clientX = e.clientX || e.touches[0].clientX;
        const clientY = e.clientY || e.touches[0].clientY;

        previousAngle = getAngle(centerX, centerY, clientX, clientY);
    }

    function drag(e) {
        if (!isDragging) return;
        e.preventDefault();

        const svgRect = document.getElementById('wind-circle').getBoundingClientRect();
        const centerX = svgRect.left + svgRect.width / 2;
        const centerY = svgRect.top + svgRect.height / 2;

        const clientX = e.clientX || e.touches[0].clientX;
        const clientY = e.clientY || e.touches[0].clientY;

        const currentAngle = getAngle(centerX, centerY, clientX, clientY);
        const angleDelta = currentAngle - previousAngle;

        currentRotation = (currentRotation + angleDelta) % 360;
        innerDisc.setAttribute('transform', `rotate(${currentRotation}, 250, 250)`);

        previousAngle = currentAngle;
    }

    function endDrag() {
        isDragging = false;
    }
}

function calculateWindTriangle() {
    const trueCourse = parseFloat(document.getElementById('true-course').value);
    const trueAirspeed = parseFloat(document.getElementById('true-airspeed').value);
    const windDirection = parseFloat(document.getElementById('wind-direction').value);
    const windSpeed = parseFloat(document.getElementById('wind-speed').value);

    if (isNaN(trueCourse) || isNaN(trueAirspeed) || isNaN(windDirection) || isNaN(windSpeed)) {
        document.getElementById('wind-result').innerHTML = 'Bitte geben Sie alle Werte ein.';
        return;
    }

    // Winkel zwischen Kurs und Wind in Radiant umrechnen
    const courseRad = trueCourse * Math.PI / 180;
    const windRad = windDirection * Math.PI / 180;

    // Windkomponenten berechnen
    const windAngle = ((windDirection - trueCourse + 360) % 360) * Math.PI / 180;
    const crosswind = windSpeed * Math.sin(windAngle);
    const headwind = windSpeed * Math.cos(windAngle);

    // Windkorrekturwinkel (WCA) berechnen
    const wca = Math.atan2(crosswind, trueAirspeed) * 180 / Math.PI;

    // Heading berechnen
    const heading = (trueCourse + wca + 360) % 360;

    // Groundspeed berechnen
    const groundSpeed = trueAirspeed * Math.cos(wca * Math.PI / 180) - headwind;

    // Ergebnis anzeigen
    document.getElementById('wind-result').innerHTML =
        `Windkorrekturwinkel: <b>${wca.toFixed(1)}°</b><br>` +
        `Heading: <b>${heading.toFixed(1)}°</b><br>` +
        `Groundspeed: <b>${groundSpeed.toFixed(1)} kt</b>`;

    // Vektoren aktualisieren
    updateWindTriangleVisual(trueCourse, trueAirspeed, windDirection, windSpeed, heading, groundSpeed);
}

function updateWindTriangleVisual(course, tas, windDir, windSpeed, heading, gs) {
    // Vektor-Elemente
    const windVector = document.getElementById('wind-vector');
    const courseVector = document.getElementById('course-vector');
    const headingVector = document.getElementById('heading-vector');

    // Skala für die Vektoren (Geschwindigkeit zu Pixeln)
    const scale = 0.8; // Skalierungsfaktor

    // Zentrum des SVG
    const center = 250;

    // Wind-Vektor aktualisieren
    const windAngle = (windDir + 180) % 360; // Umkehren für Richtung des Windes
    const windX = center + Math.sin(windAngle * Math.PI / 180) * windSpeed * scale;
    const windY = center - Math.cos(windAngle * Math.PI / 180) * windSpeed * scale;

    windVector.setAttribute('x1', center);
    windVector.setAttribute('y1', center);
    windVector.setAttribute('x2', windX);
    windVector.setAttribute('y2', windY);
    windVector.style.display = 'block';

    // Kurs-Vektor aktualisieren
    const courseX = center + Math.sin(course * Math.PI / 180) * gs * scale;
    const courseY = center - Math.cos(course * Math.PI / 180) * gs * scale;

    courseVector.setAttribute('x1', center);
    courseVector.setAttribute('y1', center);
    courseVector.setAttribute('x2', courseX);
    courseVector.setAttribute('y2', courseY);

    // Heading-Vektor aktualisieren
    const headingX = center + Math.sin(heading * Math.PI / 180) * tas * scale;
    const headingY = center - Math.cos(heading * Math.PI / 180) * tas * scale;

    headingVector.setAttribute('x1', center);
    headingVector.setAttribute('y1', center);
    headingVector.setAttribute('x2', headingX);
    headingVector.setAttribute('y2', headingY);

    // Inneren Kreis drehen
    document.getElementById('inner-disc').setAttribute('transform', `rotate(${course}, 250, 250)`);
}

// ===== Gyroskop-Funktionen =====
let gyroMode = 'manual';
let deviceOrientationSupported = false;

function changeGyroMode() {
    gyroMode = document.getElementById('gyro-mode').value;

    if (gyroMode === 'device') {
        // Überprüfen, ob DeviceOrientation verfügbar ist
        if (window.DeviceOrientationEvent) {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS 13+ erfordert Berechtigungsanfrage
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleDeviceOrientation);
                            deviceOrientationSupported = true;
                        } else {
                            alert('Berechtigung zur Nutzung der Gerätesensoren verweigert.');
                            document.getElementById('gyro-mode').value = 'manual';
                            gyroMode = 'manual';
                        }
                    })
                    .catch(console.error);
            } else {
                // Andere Browser
                window.addEventListener('deviceorientation', handleDeviceOrientation);
                deviceOrientationSupported = true;
            }
        } else {
            alert('Ihr Gerät unterstützt keine Orientierungssensoren. Manueller Modus wird verwendet.');
            document.getElementById('gyro-mode').value = 'manual';
            gyroMode = 'manual';
        }
    } else {
        // Gerätesensor-Event-Listener entfernen
        if (deviceOrientationSupported) {
            window.removeEventListener('deviceorientation', handleDeviceOrientation);
        }
    }
}

function handleDeviceOrientation(event) {
    if (gyroMode !== 'device') return;

    // Beta: Pitch (Nicken) - Rotation um die X-Achse (-180 bis 180)
    // Gamma: Roll (Rollen) - Rotation um die Y-Achse (-90 bis 90)
    // Alpha: Heading (Gieren) - Rotation um die Z-Achse (0 bis 360)
    const pitch = event.beta;
    const roll = event.gamma;
    const heading = event.alpha;

    updateGyro(pitch, roll, heading);
}

function updateGyroManual() {
    if (gyroMode !== 'manual') return;

    const pitch = parseFloat(document.getElementById('manual-pitch').value);
    const roll = parseFloat(document.getElementById('manual-roll').value);
    const heading = parseFloat(document.getElementById('manual-heading').value);

    updateGyro(pitch, roll, heading);
}

function updateGyro(pitch, roll, heading) {
    // Werte auf den Gyro anwenden
    const gyro = document.getElementById('gyroscope');

    // Werte auf sinnvolle Bereiche begrenzen
    const limitedPitch = Math.max(-90, Math.min(90, pitch));
    const limitedRoll = Math.max(-180, Math.min(180, roll));

    // 3D-Transformation anwenden
    gyro.style.transform = `rotateX(${limitedPitch}deg) rotateY(${limitedRoll}deg) rotateZ(${heading}deg)`;

    // Werte anzeigen
    document.getElementById('pitch-value').textContent = `${limitedPitch.toFixed(1)}°`;
    document.getElementById('roll-value').textContent = `${limitedRoll.toFixed(1)}°`;
    document.getElementById('heading-value').textContent = `${heading.toFixed(1)}°`;
}

// Initialisierung
window.onload = function() {
    initDegreeMarks();
    initRotatableDisc();
    updateGyroManual(); // Initialen Gyro-Status setzen
};
</script>
